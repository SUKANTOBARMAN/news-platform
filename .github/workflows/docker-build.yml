name: Docker Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (production target)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          tags: news-platform-backend:ci

      - name: Build frontend image (production target)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          tags: news-platform-frontend:ci
