# প্রোডাকশন compose file -- optimized build, nginx দিয়ে ফ্রন্টএন্ড সার্ভ, একাধিক
# uvicorn worker। চালাতে: docker compose -f docker-compose.prod.yml up --build -d
version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: news_platform
      MYSQL_USER: news_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build:
      context: ./backend
      target: production
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
